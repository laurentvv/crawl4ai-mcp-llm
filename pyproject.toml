[project]
name = "crawl4ai-mcp-llm"
version = "0.2.1"
description = "A Model Context Protocol (MCP) server for Crawl4AI"
readme = "README_PYPI.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anyio>=4.12.1",
    "click>=8.3.1",
    "crawl4ai>=0.9.2",
    "mcp>=2.0.0,<3",
    "playwright>=1.58.0",
    "pydantic>=2.11",
]

[project.urls]
Homepage = "https://github.com/laurentvv/crawl4ai-mcp-llm"
Issues = "https://github.com/laurentvv/crawl4ai-mcp-llm/issues"
Changelog = "https://github.com/laurentvv/crawl4ai-mcp-llm/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[project.scripts]
crawl4ai-mcp-llm = "crawl4ai_mcp_llm.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawl4ai_mcp_llm"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "README_PYPI.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["crawl4ai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["crawl_results", ".git", ".venv"]
addopts = "-m 'not integration'"
markers = ["integration: tests that reach the network and launch a real browser"]

[tool.coverage.run]
source = ["crawl4ai_mcp_llm"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

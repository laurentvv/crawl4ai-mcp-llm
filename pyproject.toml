[project]
name = "crawl4ai-mcp-llm"
version = "0.1.4"
description = "A Model Context Protocol (MCP) server for Crawl4AI"
readme = "README_PYPI.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio>=4.12.1",
    "chardet>=5.2.0",
    "click>=8.3.1",
    "crawl4ai>=0.8.5",
    "httpx>=0.28.1",
    "lxml>=5.4.0",
    "mcp>=2.0.0",
    "playwright>=1.58.0",
    "urllib3>=1.26.15",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
crawl4ai-mcp-llm = "crawl4ai_mcp_llm.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawl4ai_mcp_llm"]

[tool.ruff.lint]
extend-ignore = ["E402"]
